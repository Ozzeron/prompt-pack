name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run skill linter
        run: npm run lint

  shellcheck:
    name: ShellCheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  install-sh-smoke:
    # Run on both Ubuntu (bash 5.x) and macOS (bash 3.2 default).
    # macOS still ships bash 3.2 because of the GPLv3 switch, so any bash 4+
    # builtin (mapfile, readarray, declare -A, ${var^^}, etc.) silently breaks
    # the installer for Mac users with no warning. CI on Ubuntu alone misses
    # this entire class of bug.
    name: install.sh smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version

      - name: List profiles and skills
        run: ./install.sh --list

      - name: Dry-run install (cursor / minimal) into temp dir
        run: |
          mkdir -p /tmp/test-cursor
          cd /tmp/test-cursor
          git init -q
          $GITHUB_WORKSPACE/install.sh --target cursor --profile minimal --dry-run

      - name: Dry-run install (agents / minimal) into temp dir
        run: |
          mkdir -p /tmp/test-agents
          cd /tmp/test-agents
          git init -q
          $GITHUB_WORKSPACE/install.sh --target agents --profile minimal --dry-run

      - name: Dry-run install (cursor-foundation / minimal) into temp dir
        run: |
          mkdir -p /tmp/test-cursor-foundation
          cd /tmp/test-cursor-foundation
          git init -q
          $GITHUB_WORKSPACE/install.sh --target cursor-foundation --profile minimal --dry-run

      - name: Dry-run install (codex / supabase) into temp dir
        run: |
          mkdir -p /tmp/test-codex
          cd /tmp/test-codex
          git init -q
          $GITHUB_WORKSPACE/install.sh --target codex --profile supabase --dry-run

      - name: Dry-run install (claude-code / fullstack) into temp dir
        run: |
          mkdir -p /tmp/test-claude
          cd /tmp/test-claude
          git init -q
          $GITHUB_WORKSPACE/install.sh --target claude-code --profile fullstack --dry-run

      - name: Dry-run install (claude-skills / fullstack) into temp dir
        run: |
          mkdir -p /tmp/test-claude-skills
          cd /tmp/test-claude-skills
          git init -q
          $GITHUB_WORKSPACE/install.sh --target claude-skills --profile fullstack --dry-run

      - name: Dry-run install (openclaw / all) into temp dir
        run: |
          mkdir -p /tmp/test-openclaw
          cd /tmp/test-openclaw
          git init -q
          $GITHUB_WORKSPACE/install.sh --target openclaw --profile all --dry-run

      - name: Dry-run install (raw / nextjs) into temp dir
        run: |
          mkdir -p /tmp/test-raw
          cd /tmp/test-raw
          git init -q
          $GITHUB_WORKSPACE/install.sh --target raw --profile nextjs --dry-run

  install-ps1-smoke:
    name: install.ps1 smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: List profiles and skills
        shell: pwsh
        run: .\install.ps1 -List

      - name: Dry-run install (raw target, nextjs profile)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:TEMP\test-raw" -Force | Out-Null
          Set-Location "$env:TEMP\test-raw"
          git init -q
          & "$env:GITHUB_WORKSPACE\install.ps1" -Target raw -Profile nextjs -DryRun

      - name: Dry-run install (agents / minimal, Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:TEMP\test-agents" -Force | Out-Null
          Set-Location "$env:TEMP\test-agents"
          git init -q
          & "$env:GITHUB_WORKSPACE\install.ps1" -Target agents -Profile minimal -DryRun

      - name: Dry-run install (cursor / minimal, Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:TEMP\test-cursor" -Force | Out-Null
          Set-Location "$env:TEMP\test-cursor"
          git init -q
          & "$env:GITHUB_WORKSPACE\install.ps1" -Target cursor -Profile minimal -DryRun

      - name: Dry-run install (claude-skills / fullstack, Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:TEMP\test-claude-skills" -Force | Out-Null
          Set-Location "$env:TEMP\test-claude-skills"
          git init -q
          & "$env:GITHUB_WORKSPACE\install.ps1" -Target claude-skills -Profile fullstack -DryRun

      - name: Assert dry-run did not write files
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\test-raw\docs\ai-rules") {
            throw "DryRun created docs\ai-rules - safety contract violated"
          }
          if (Test-Path "$env:TEMP\test-claude-skills\.claude") {
            throw "DryRun created .claude - safety contract violated"
          }
          Write-Host "OK: no files written by dry-run"
